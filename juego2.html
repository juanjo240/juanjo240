
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atrapa al po</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #000000;
  color: white;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  color: #f81557;
  font-size: 30px;
}

.marcador b {
  color: #f81557;
  margin-right: 10px;
}

#zona {
  position: relative;
  height: 55vh;
  border: 3px solid #f81557;
  border-radius: 20px;
  overflow: hidden;
}

#bicho {
  position: absolute;
  font-size: 50px;
  background: none;
  border: none;
  transition: left 0.3s, top 0.3s;
  touch-action: manipulation;
  cursor: pointer;
}

#empezar {
  margin-top: 15px;
  padding: 15px 40px;
  font-size: 20px;
  border: none;
  border-radius: 50px;
  background: #f81557;
  color: white;
  cursor: pointer;
}

#mensaje {
  font-size: 16px;
}
</style>
</head>

<body>

<h1>Atrapa al po</h1>

<p class="marcador">
Puntos: <b id="puntos">0</b>
Tiempo: <b id="tiempo">20</b>
Récord: <b id="record">0</b>
</p>

<div id="zona">
  <button id="bicho">🐼</button>
</div>

<button id="empezar">¡Jugar!</button>

<p id="mensaje">Toca el 🐼 antes de que se escape</p>

<!-- CANCIÓN DE FONDO -->
<audio id="musica" preload="auto">
  <source src="Canción misión imposible - el apocalíptico 0.mp3" type="audio/mpeg">
  Tu navegador no admite audio.
</audio>

<script>

let puntos = 0;
let tiempo = 20;
let jugando = false;
let reloj;

let record = localStorage.getItem("record") || 0;

const bicho = document.getElementById("bicho");
const zona = document.getElementById("zona");
const musica = document.getElementById("musica");

document.getElementById("record").textContent = record;


// SONIDO ORIGINAL DEL PANDA

let audio;

function iniciarAudio() {

  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audio.state === "suspended") {
    audio.resume();
  }

}

function sonidoTiempo() {

  iniciarAudio();

  const ahora = audio.currentTime;

  // GOLPE GRAVE

  const osc = audio.createOscillator();
  const volumen = audio.createGain();

  osc.type = "sawtooth";

  osc.frequency.setValueAtTime(130, ahora);
  osc.frequency.exponentialRampToValueAtTime(45, ahora + 0.25);

  volumen.gain.setValueAtTime(0.35, ahora);
  volumen.gain.exponentialRampToValueAtTime(0.001, ahora + 0.3);

  osc.connect(volumen);
  volumen.connect(audio.destination);

  osc.start(ahora);
  osc.stop(ahora + 0.3);

  // TONO AGUDO

  const tono = audio.createOscillator();
  const volumen2 = audio.createGain();

  tono.type = "triangle";

  tono.frequency.setValueAtTime(700, ahora);
  tono.frequency.exponentialRampToValueAtTime(250, ahora + 0.2);

  volumen2.gain.setValueAtTime(0.12, ahora);
  volumen2.gain.exponentialRampToValueAtTime(0.001, ahora + 0.2);

  tono.connect(volumen2);
  volumen2.connect(audio.destination);

  tono.start(ahora);
  tono.stop(ahora + 0.2);

}


// MOVER PANDA

function mover() {

  const maxX = Math.max(0, zona.clientWidth - bicho.offsetWidth);
  const maxY = Math.max(0, zona.clientHeight - bicho.offsetHeight);

  let x = Math.random() * maxX;
  let y = Math.random() * maxY;

  bicho.style.left = x + "px";
  bicho.style.top = y + "px";

}

mover();


// ATRAPAR PANDA

bicho.addEventListener("click", function() {

  if (jugando) {

    puntos++;

    document.getElementById("puntos").textContent = puntos;

    mover();

  }

});


// INICIAR CANCIÓN MP3

function iniciarMusica() {

  musica.currentTime = 0;
  musica.volume = 1;

  musica.play().catch(function(error) {

    document.getElementById("mensaje").textContent =
      "No se pudo cargar la música. Revisa que el MP3 esté en la misma carpeta.";

    console.error("Error de audio:", error);

  });

}


// DETENER CANCIÓN

function detenerMusica() {

  musica.pause();
  musica.currentTime = 0;

}


// EMPEZAR JUEGO

function empezar() {

  iniciarAudio();

  detenerMusica();

  puntos = 0;
  tiempo = 20;
  jugando = true;

  document.getElementById("puntos").textContent = puntos;
  document.getElementById("tiempo").textContent = tiempo;

  document.getElementById("mensaje").textContent = "¡Atrápalo!";

  mover();

  clearInterval(reloj);

  reloj = setInterval(function() {

    tiempo--;

    document.getElementById("tiempo").textContent = tiempo;

    // SONIDO DEL PANDA CADA SEGUNDO

    sonidoTiempo();

    mover();

    // CANCIÓN AL LLEGAR A 15 SEGUNDOS

    if (tiempo === 15) {

      iniciarMusica();

      document.getElementById("mensaje").textContent =
        "🔥 ¡MISIÓN IMPOSIBLE! ¡ATRÁPALO!";

    }

    // TERMINAR CUANDO LLEGUE A CERO

    if (tiempo <= 0) {

      terminar();

    }

  }, 1000);

}


// TERMINAR JUEGO

function terminar() {

  jugando = false;

  clearInterval(reloj);

  detenerMusica();

  if (puntos > record) {

    record = puntos;

    localStorage.setItem("record", record);

    document.getElementById("record").textContent = record;

  }

  document.getElementById("mensaje").textContent =
    "¡Se acabó el tiempo! Hiciste " + puntos + " puntos";

}


// BOTÓN JUGAR

document.getElementById("empezar").addEventListener("click", empezar);

</script>

</body>
</html>
