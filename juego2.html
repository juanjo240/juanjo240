
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atrapa al po</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #000;
  color: white;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  color: #f81557;
  font-size: 30px;
}

.marcador b {
  color: #f81557;
  margin-right: 10px;
}

#zona {
  position: relative;
  height: 55vh;
  border: 3px solid #f81557;
  border-radius: 20px;
  overflow: hidden;
}

#bicho {
  position: absolute;
  font-size: 50px;
  background: none;
  border: none;
  transition: left .3s, top .3s;
  touch-action: manipulation;
}

#empezar {
  margin-top: 15px;
  padding: 15px 40px;
  font-size: 20px;
  border: none;
  border-radius: 50px;
  background: #f81557;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Atrapa al po</h1>

<p class="marcador">
Puntos: <b id="puntos">0</b>
Tiempo: <b id="tiempo">20</b>
Récord: <b id="record">0</b>
</p>

<div id="zona">
  <button id="bicho">🐼</button>
</div>

<button id="empezar">¡Jugar!</button>
<p id="mensaje">Toca el 🐼 antes de que se escape</p>

<!-- Canción de YouTube -->
<div id="reproductor" style="position:absolute;width:1px;height:1px;overflow:hidden;">
  <iframe
    id="youtube"
    width="1"
    height="1"
    src="about:blank"
    title="Música de fondo"
    allow="autoplay; encrypted-media"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</div>

<script>
let puntos = 0;
let tiempo = 20;
let jugando = false;
let reloj;
let record = localStorage.getItem("record") || 0;
let musicaIniciada = false;

const bicho = document.getElementById("bicho");
const zona = document.getElementById("zona");
const youtube = document.getElementById("youtube");

document.getElementById("record").textContent = record;

// Sonido original del panda
let audio;

function iniciarAudio() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audio.state === "suspended") {
    audio.resume();
  }
}

function sonidoTiempo() {
  iniciarAudio();

  const ahora = audio.currentTime;

  const osc = audio.createOscillator();
  const volumen = audio.createGain();

  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(130, ahora);
  osc.frequency.exponentialRampToValueAtTime(45, ahora + 0.25);

  volumen.gain.setValueAtTime(0.35, ahora);
  volumen.gain.exponentialRampToValueAtTime(0.001, ahora + 0.3);

  osc.connect(volumen);
  volumen.connect(audio.destination);

  osc.start(ahora);
  osc.stop(ahora + 0.3);

  const tono = audio.createOscillator();
  const volumen2 = audio.createGain();

  tono.type = "triangle";
  tono.frequency.setValueAtTime(700, ahora);
  tono.frequency.exponentialRampToValueAtTime(250, ahora + 0.2);

  volumen2.gain.setValueAtTime(0.12, ahora);
  volumen2.gain.exponentialRampToValueAtTime(0.001, ahora + 0.2);

  tono.connect(volumen2);
  volumen2.connect(audio.destination);

  tono.start(ahora);
  tono.stop(ahora + 0.2);
}

function mover() {
  const maxX = Math.max(0, zona.clientWidth - bicho.offsetWidth);
  const maxY = Math.max(0, zona.clientHeight - bicho.offsetHeight);

  bicho.style.left = Math.random() * maxX + "px";
  bicho.style.top = Math.random() * maxY + "px";
}

mover();

bicho.addEventListener("click", function() {
  if (jugando) {
    puntos++;
    document.getElementById("puntos").textContent = puntos;
    mover();
  }
});

function iniciarMusica() {
  if (musicaIniciada) return;

  musicaIniciada = true;

  // El video empieza a reproducirse cuando quedan 15 segundos.
  youtube.src =
    "https://www.youtube.com/embed/yXkV0h3eM20" +
    "?autoplay=1&start=0&controls=0&loop=1&playlist=yXkV0h3eM20";
}

function detenerMusica() {
  musicaIniciada = false;
  youtube.src = "about:blank";
}

function empezar() {
  iniciarAudio();
  detenerMusica();

  puntos = 0;
  tiempo = 20;
  jugando = true;

  document.getElementById("puntos").textContent = puntos;
  document.getElementById("tiempo").textContent = tiempo;
  document.getElementById("mensaje").textContent = "¡Atrápalo!";

  mover();
  clearInterval(reloj);

  reloj = setInterval(function() {
    tiempo--;

    document.getElementById("tiempo").textContent = tiempo;

    // Mantiene el sonido original cada segundo.
    sonidoTiempo();
    mover();

    // Inicia la canción cuando quedan 15 segundos.
    if (tiempo === 15) {
      iniciarMusica();
    }

    if (tiempo <= 0) {
      terminar();
    }
  }, 1000);
}

function terminar() {
  jugando = false;
  clearInterval(reloj);
  detenerMusica();

  if (puntos > record) {
    record = puntos;
    localStorage.setItem("record", record);
    document.getElementById("record").textContent = record;
  }

  document.getElementById("mensaje").textContent =
    "¡Se acabó el tiempo! Hiciste " + puntos + " puntos";
}

document.getElementById("empezar").addEventListener("click", empezar);
</script>

</body>
</html>
