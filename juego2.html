
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atrapa al po</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #000000;
  color: white;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  color: #f81557;
  font-size: 30px;
}

.marcador b {
  color: #f81557;
  margin-right: 10px;
}

#zona {
  position: relative;
  height: 55vh;
  border: 3px solid #f81557;
  border-radius: 20px;
  overflow: hidden;
}

#bicho {
  position: absolute;
  font-size: 50px;
  background: none;
  border: none;
  transition: left 0.15s, top 0.15s;
  touch-action: manipulation;
  cursor: pointer;
}

#empezar {
  margin-top: 15px;
  padding: 15px 40px;
  font-size: 20px;
  border: none;
  border-radius: 50px;
  background: #f81557;
  color: white;
  cursor: pointer;
}

#mensaje {
  font-size: 16px;
}

#nivel {
  color: #f81557;
  font-weight: bold;
}

#clasificacion {
  margin: 25px auto;
  max-width: 500px;
  padding: 15px;
  border: 2px solid #f81557;
  border-radius: 15px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #444;
}

th {
  color: #f81557;
}

#ventanaNombre {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 10;
  justify-content: center;
  align-items: center;
}

#contenidoNombre {
  background: #171717;
  border: 2px solid #f81557;
  border-radius: 20px;
  padding: 25px;
  width: 80%;
  max-width: 350px;
}

#nombreJugador {
  width: 80%;
  padding: 12px;
  margin: 15px 0;
  text-align: center;
  font-size: 25px;
  text-transform: uppercase;
  border: 2px solid #f81557;
  border-radius: 10px;
  background: black;
  color: white;
}

#guardarNombre {
  background: #f81557;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 12px 30px;
  font-size: 18px;
  cursor: pointer;
}

</style>
</head>

<body>

<h1>Atrapa al po</h1>

<p class="marcador">
Puntos: <b id="puntos">0</b>
Tiempo: <b id="tiempo">20</b>
Récord: <b id="record">0</b>
</p>

<p id="nivel">Velocidad: x1.00</p>

<div id="zona">
  <button id="bicho">🐼</button>
</div>

<button id="empezar">¡Jugar!</button>

<p id="mensaje">Toca el 🐼 antes de que se escape</p>

<!-- TABLA DE CAMPEONES -->

<div id="clasificacion">

<h2>🏆 TABLA DE CAMPEONES</h2>

<table>
<thead>
<tr>
<th>Posición</th>
<th>Jugador</th>
<th>Puntos</th>
</tr>
</thead>

<tbody id="tablaJugadores">
<tr>
<td colspan="3">Todavía no hay campeones</td>
</tr>
</tbody>
</table>

</div>

<!-- VENTANA PARA NOMBRE -->

<div id="ventanaNombre">

<div id="contenidoNombre">

<h2>🏆 ¡NUEVO RÉCORD!</h2>

<p>¡Has superado el récord!</p>

<p>Escribe tu nombre de 3 letras:</p>

<input
id="nombreJugador"
type="text"
maxlength="3"
minlength="3"
placeholder="ABC"
autocomplete="off"
>

<br>

<button id="guardarNombre">Guardar campeón</button>

<p id="errorNombre"></p>

</div>

</div>

<!-- CANCIÓN MP3 -->

<audio id="musica" preload="auto">
<source src="Canción misión imposible - el apocalíptico 0.mp3" type="audio/mpeg">
</audio>

<script>

// VARIABLES PRINCIPALES

let puntos = 0;
let tiempo = 20;
let jugando = false;
let reloj;
let movimiento;

let velocidad = 1;
let siguienteNivel = 15;
let tiempoMusicaIniciada = false;

let record = Number(localStorage.getItem("record")) || 0;

let campeones = [];

try {
  campeones = JSON.parse(
    localStorage.getItem("campeones") || "[]"
  );

  if (!Array.isArray(campeones)) {
    campeones = [];
  }
} catch (e) {
  campeones = [];
}

const bicho = document.getElementById("bicho");
const zona = document.getElementById("zona");
const musica = document.getElementById("musica");

document.getElementById("record").textContent = record;


// SONIDO ORIGINAL DEL PANDA

let audio;

function iniciarAudio() {

  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audio.state === "suspended") {
    audio.resume();
  }

}

function sonidoTiempo() {

  iniciarAudio();

  const ahora = audio.currentTime;

  // GOLPE GRAVE

  const osc = audio.createOscillator();
  const volumen = audio.createGain();

  osc.type = "sawtooth";

  osc.frequency.setValueAtTime(130, ahora);
  osc.frequency.exponentialRampToValueAtTime(45, ahora + 0.25);

  volumen.gain.setValueAtTime(0.35, ahora);
  volumen.gain.exponentialRampToValueAtTime(0.001, ahora + 0.3);

  osc.connect(volumen);
  volumen.connect(audio.destination);

  osc.start(ahora);
  osc.stop(ahora + 0.3);

  // TONO AGUDO

  const tono = audio.createOscillator();
  const volumen2 = audio.createGain();

  tono.type = "triangle";

  tono.frequency.setValueAtTime(700, ahora);
  tono.frequency.exponentialRampToValueAtTime(250, ahora + 0.2);

  volumen2.gain.setValueAtTime(0.12, ahora);
  volumen2.gain.exponentialRampToValueAtTime(0.001, ahora + 0.2);

  tono.connect(volumen2);
  volumen2.connect(audio.destination);

  tono.start(ahora);
  tono.stop(ahora + 0.2);

}


// MOVER PANDA

function mover() {

  const maxX = Math.max(0, zona.clientWidth - bicho.offsetWidth);
  const maxY = Math.max(0, zona.clientHeight - bicho.offsetHeight);

  bicho.style.left = Math.random() * maxX + "px";
  bicho.style.top = Math.random() * maxY + "px";

}


// ACTUALIZAR VELOCIDAD

function actualizarVelocidad() {

  clearInterval(movimiento);

  let intervalo = 1000 / velocidad;

  movimiento = setInterval(function() {

    if (jugando) {
      mover();
    }

  }, intervalo);

  document.getElementById("nivel").textContent =
    "Velocidad: x" + velocidad.toFixed(2);

}


// TABLA DE CAMPEONES

function actualizarTabla() {

  const tabla = document.getElementById("tablaJugadores");

  tabla.innerHTML = "";

  if (campeones.length === 0) {

    tabla.innerHTML =
      '<tr><td colspan="3">Todavía no hay campeones</td></tr>';

    return;
  }

  campeones.sort(function(a, b) {
    return b.puntos - a.puntos;
  });

  campeones.slice(0, 10).forEach(function(jugador, indice) {

    const fila = document.createElement("tr");

    const posicion = document.createElement("td");
    const nombre = document.createElement("td");
    const puntuacion = document.createElement("td");

    const medallas = ["🥇", "🥈", "🥉"];

    posicion.textContent =
      medallas[indice] || (indice + 1);

    nombre.textContent = jugador.nombre;
    puntuacion.textContent = jugador.puntos;

    fila.appendChild(posicion);
    fila.appendChild(nombre);
    fila.appendChild(puntuacion);

    tabla.appendChild(fila);

  });

}

actualizarTabla();


// ATRAPAR PANDA

bicho.addEventListener("click", function() {

  if (jugando) {

    puntos++;

    document.getElementById("puntos").textContent = puntos;

    mover();

    // CADA 15 PUNTOS

    if (puntos >= siguienteNivel) {

      // AÑADIR 5 SEGUNDOS

      tiempo += 5;

      document.getElementById("tiempo").textContent = tiempo;

      // AUMENTAR VELOCIDAD X1.5

      velocidad *= 1.5;

      siguienteNivel += 15;

      actualizarVelocidad();

      document.getElementById("mensaje").textContent =
        "🔥 ¡NUEVO NIVEL! +5 SEGUNDOS Y MÁS VELOCIDAD";

    }

  }

});


// MÚSICA

function iniciarMusica() {

  musica.currentTime = 0;
  musica.volume = 1;

  musica.play().catch(function(error) {

    document.getElementById("mensaje").textContent =
      "Revisa que el archivo MP3 esté en la misma carpeta.";

    console.error(error);

  });

}

function detenerMusica() {

  musica.pause();
  musica.currentTime = 0;

}


// EMPEZAR JUEGO

function empezar() {

  iniciarAudio();

  detenerMusica();

  clearInterval(reloj);
  clearInterval(movimiento);

  puntos = 0;
  tiempo = 20;
  velocidad = 1;
  siguienteNivel = 15;
  tiempoMusicaIniciada = false;

  jugando = true;

  document.getElementById("puntos").textContent = puntos;
  document.getElementById("tiempo").textContent = tiempo;

  document.getElementById("mensaje").textContent = "¡Atrápalo!";

  document.getElementById("nivel").textContent =
    "Velocidad: x1.00";

  mover();

  actualizarVelocidad();

  // RELOJ

  reloj = setInterval(function() {

    if (!jugando) return;

    tiempo--;

    document.getElementById("tiempo").textContent = tiempo;

    sonidoTiempo();

    // MÚSICA A LOS 15 SEGUNDOS

    if (tiempo <= 15 && !tiempoMusicaIniciada) {

      tiempoMusicaIniciada = true;

      iniciarMusica();

      document.getElementById("mensaje").textContent =
        "🔥 ¡MISIÓN IMPOSIBLE! ¡ATRÁPALO!";

    }

    if (tiempo <= 0) {
      terminar();
    }

  }, 1000);

}


// TERMINAR JUEGO

function terminar() {

  jugando = false;

  clearInterval(reloj);
  clearInterval(movimiento);

  detenerMusica();

  document.getElementById("mensaje").textContent =
    "¡Se acabó el tiempo! Hiciste " + puntos + " puntos";

  // COMPROBAR SI HAY NUEVO RÉCORD

  if (puntos > record) {

    record = puntos;

    document.getElementById("record").textContent = record;

    localStorage.setItem("record", record);

    // ABRIR VENTANA DE NOMBRE

    document.getElementById("nombreJugador").value = "";
    document.getElementById("errorNombre").textContent = "";

    document.getElementById("ventanaNombre").style.display =
      "flex";

    document.getElementById("nombreJugador").focus();

  }

}


// GUARDAR NUEVO CAMPEÓN

document.getElementById("guardarNombre").addEventListener("click", function() {

  const campo = document.getElementById("nombreJugador");

  const nombre = campo.value.trim().toUpperCase();

  if (!/^[A-Z]{3}$/.test(nombre)) {

    document.getElementById("errorNombre").textContent =
      "Escribe exactamente 3 letras (sin números ni espacios).";

    return;
  }

  // GUARDAR JUGADOR

  campeones.push({
    nombre: nombre,
    puntos: puntos
  });

  campeones.sort(function(a, b) {
    return b.puntos - a.puntos;
  });

  // GUARDAR LOS 10 MEJORES

  campeones = campeones.slice(0, 10);

  localStorage.setItem("campeones", JSON.stringify(campeones));

  actualizarTabla();

  document.getElementById("ventanaNombre").style.display =
    "none";

  document.getElementById("mensaje").textContent =
    "🏆 ¡FELICIDADES " + nombre + "! ERES EL NUEVO CAMPEÓN";

});


// PERMITIR ENTER PARA GUARDAR

document.getElementById("nombreJugador").addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    document.getElementById("guardarNombre").click();
  }

});


// BOTÓN JUGAR

document.getElementById("empezar").addEventListener("click", empezar);

</script>

</body>
</html>
