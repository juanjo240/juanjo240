
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloqueCraft</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block}
#top{position:fixed;top:10px;left:10px;color:white;text-shadow:2px 2px 3px black;font-weight:bold;pointer-events:none}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:25px;text-shadow:1px 1px 3px black;pointer-events:none}
#message{position:fixed;top:55px;left:50%;transform:translateX(-50%);color:white;text-shadow:2px 2px 3px black;font-weight:bold}
#hotbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.slot{width:53px;height:53px;border:2px solid #777;background:#222b;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;position:relative}
.slot.selected{border:3px solid white;background:#666b}
.count{position:absolute;bottom:2px;right:3px;font-size:12px}
#inventory{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#333f;border:3px solid #aaa;padding:16px;color:white;width:min(440px,94vw);max-height:85vh;overflow:auto}
#items{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.item{background:#555;border:1px solid #999;padding:10px 3px;text-align:center;cursor:pointer}
.recipe{display:block;width:100%;padding:10px;margin-top:7px;background:#777;color:white;border:1px solid #aaa;cursor:pointer}
#inventory button:last-child{padding:9px;margin-top:10px;width:100%}
#start{position:fixed;inset:0;background:#000b;color:white;display:flex;align-items:center;justify-content:center;text-align:center;z-index:10}
#start button{padding:14px 30px;font-size:18px;cursor:pointer}
#mobile,#mobileActions{display:none;position:fixed;bottom:85px;gap:5px}
#mobile{left:10px}
#mobileActions{right:10px;flex-direction:column}
#mobile button,#mobileActions button{width:46px;height:46px;background:#222b;color:white;border:1px solid white;border-radius:8px;font-size:20px}
#mobile .row{display:flex;justify-content:center;gap:4px}
</style>
</head>
<body>

<div id="top">BLOQUECRAFT<br><small>WASD: mover | Espacio: saltar | E: inventario</small></div>
<div id="crosshair">+</div>
<div id="message"></div>
<div id="hotbar"></div>

<div id="inventory">
<h2>Inventario</h2>
<div id="items"></div>
<h3>Fabricación</h3>
<button class="recipe" onclick="craft('planks')">1 tronco → 4 tablones</button>
<button class="recipe" onclick="craft('table')">4 tablones → Mesa de crafteo</button>
<button class="recipe" onclick="craft('furnace')">8 piedras → Horno (requiere mesa colocada)</button>
<p id="craftInfo"></p>
<button onclick="toggleInventory()">Cerrar (E)</button>
</div>

<div id="mobile">
<div class="row"><button data-move="forward">▲</button></div>
<div class="row">
<button data-move="left">◀</button>
<button data-move="back">▼</button>
<button data-move="right">▶</button>
</div>
</div>
<div id="mobileActions">
<button onclick="jump()">↑</button>
<button onclick="breakBlock()">⛏</button>
<button onclick="placeBlock()">▣</button>
<button onclick="toggleInventory()">I</button>
</div>

<div id="start">
<div>
<h1>BLOQUECRAFT</h1>
<p>Explora, recolecta y construye tu mundo.</p>
<button onclick="startGame()">JUGAR</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){
 document.body.innerHTML="<h2>No se pudo cargar el juego. Revisa tu conexión a internet.</h2>";
 throw new Error("Three.js no disponible");
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,45,105);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x65734d,1.5));
const sun=new THREE.DirectionalLight(0xffffff,1.15);
sun.position.set(30,50,20);
scene.add(sun);

function pixelTexture(base,spots=40){
 const c=document.createElement("canvas");
 c.width=c.height=16;
 const ctx=c.getContext("2d");
 ctx.fillStyle=base;
 ctx.fillRect(0,0,16,16);
 for(let i=0;i<spots;i++){
  ctx.fillStyle=Math.random()>.5?"#ffffff25":"#00000025";
  ctx.fillRect(Math.floor(Math.random()*16),Math.floor(Math.random()*16),2,2);
 }
 const t=new THREE.CanvasTexture(c);
 t.magFilter=THREE.NearestFilter;
 t.minFilter=THREE.NearestFilter;
 return t;
}
function mat(color,spots){
 return new THREE.MeshLambertMaterial({map:pixelTexture(color,spots)});
}

const dirtMat=mat("#86502c",35);
const grassTop=mat("#55a832",55);
const grassSide=mat("#86502c",35);
const stoneMat=mat("#858585",45);
const leavesMat=mat("#267b25",55);
const woodMat=mat("#80502a",30);
const planksMat=mat("#bd8747",30);
const tableMat=mat("#98602f",30);
const furnaceMat=mat("#555555",35);

const grassMaterials=[
 grassSide,grassSide,grassTop,dirtMat,grassSide,grassSide
];

const blocks={};
const key=(x,y,z)=>`${x},${y},${z}`;
const geometry=new THREE.BoxGeometry(1,1,1);

function addBlock(x,y,z,type){
 const k=key(x,y,z);
 if(blocks[k])return;
 let material=type==="grass"?grassMaterials:
  type==="dirt"?dirtMat:
  type==="stone"?stoneMat:
  type==="leaves"?leavesMat:
  type==="wood"?woodMat:
  type==="planks"?planksMat:
  type==="table"?tableMat:furnaceMat;

 const mesh=new THREE.Mesh(geometry,material);
 mesh.position.set(x,y,z);
 mesh.userData={x,y,z,type};
 scene.add(mesh);
 blocks[k]=mesh;
}
function removeBlock(x,y,z){
 const k=key(x,y,z);
 if(!blocks[k])return false;
 scene.remove(blocks[k]);
 delete blocks[k];
 return true;
}

function heightAt(x,z){
 return Math.floor(
  2+
  Math.sin(x*.19)*1.5+
  Math.cos(z*.17)*1.4+
  Math.sin((x+z)*.12)*1.1
 );
}

function generateWorld(){
 for(let x=-25;x<=25;x++){
  for(let z=-25;z<=25;z++){
   const h=heightAt(x,z);
   addBlock(x,h,z,"grass");
   for(let y=h-1;y>=h-3;y--)addBlock(x,y,z,"dirt");
   for(let y=h-4;y>=-4;y--)addBlock(x,y,z,"stone");
  }
 }
}

// Árboles con tronco de madera y copa de hojas
function tree(x,z){
 const h=heightAt(x,z);
 for(let y=1;y<=4;y++)addBlock(x,h+y,z,"wood");

 for(let dx=-2;dx<=2;dx++){
  for(let dz=-2;dz<=2;dz++){
   for(let dy=2;dy<=5;dy++){
    if(Math.abs(dx)+Math.abs(dz)+(dy===5?1:0)<=4){
     addBlock(x+dx,h+dy,z+dz,"leaves");
    }
   }
  }
 }
}

generateWorld();
[
 [-12,-8],[10,-12],[-8,13],[16,8],
 [3,-18],[-19,4],[20,-3],[0,20],
 [-17,-15],[14,17]
].forEach(p=>tree(p[0],p[1]));

// Pequeñas plantas decorativas sobre el césped
const grassDecoration=new THREE.Group();
const plantMat=new THREE.MeshLambertMaterial({color:0x389c32,side:THREE.DoubleSide});
for(let i=0;i<170;i++){
 const x=Math.floor(Math.random()*49)-24;
 const z=Math.floor(Math.random()*49)-24;
 const h=heightAt(x,z);
 if(blocks[key(x,h+1,z)])continue;
 const blade=new THREE.Mesh(new THREE.PlaneGeometry(.35,.65),plantMat);
 blade.position.set(x,h+.32,z);
 blade.rotation.y=Math.random()*Math.PI;
 grassDecoration.add(blade);
}
scene.add(grassDecoration);

const inventory={
 grass:0,dirt:0,stone:0,leaves:0,
 wood:0,planks:0,table:0,furnace:0
};
const labels={
 grass:"Césped",dirt:"Tierra",stone:"Piedra",
 leaves:"Hojas",wood:"Tronco",planks:"Tablones",
 table:"Mesa",furnace:"Horno"
};
const icons={
 grass:"🟩",dirt:"🟫",stone:"⬜",leaves:"🍃",
 wood:"🪵",planks:"🟨",table:"🛠️",furnace:"🔥"
};
const hotTypes=Object.keys(inventory);
let selected=0;
let placedTable=false;

function updateInventory(){
 const items=document.getElementById("items");
 items.innerHTML="";
 hotTypes.forEach(type=>{
  const div=document.createElement("div");
  div.className="item";
  div.innerHTML=`${icons[type]}<br>${labels[type]}<br>${inventory[type]}`;
  div.onclick=()=>{
   selected=hotTypes.indexOf(type);
   updateHotbar();
  };
  items.appendChild(div);
 });
 document.getElementById("craftInfo").textContent=
 "Mesa colocada: "+(placedTable?"Sí":"No");
 updateHotbar();
}

function updateHotbar(){
 const bar=document.getElementById("hotbar");
 bar.innerHTML="";
 hotTypes.slice(0,8).forEach((type,i)=>{
  const slot=document.createElement("div");
  slot.className="slot"+(i===selected?" selected":"");
  slot.innerHTML=inventory[type]>0?
   icons[type]+`<span class="count">${inventory[type]}</span>`:"";
  bar.appendChild(slot);
 });
}

function craft(type){
 if(type==="planks"){
  if(inventory.wood<1){say("Necesitas un tronco");return}
  inventory.wood--;
  inventory.planks+=4;
  say("¡4 tablones fabricados!");
 }
 if(type==="table"){
  if(inventory.planks<4){say("Necesitas 4 tablones");return}
  inventory.planks-=4;
  inventory.table++;
  say("¡Mesa de crafteo fabricada!");
 }
 if(type==="furnace"){
  if(!placedTable){say("Coloca primero la mesa de crafteo");return}
  if(inventory.stone<8){say("Necesitas 8 piedras");return}
  inventory.stone-=8;
  inventory.furnace++;
  say("¡Horno fabricado!");
 }
 updateInventory();
}

function say(t){
 const el=document.getElementById("message");
 el.textContent=t;
 clearTimeout(say.timer);
 say.timer=setTimeout(()=>el.textContent="",2000);
}

function toggleInventory(){
 const el=document.getElementById("inventory");
 el.style.display=el.style.display==="block"?"none":"block";
 updateInventory();
}

const player={x:0,y:14,z:20,yaw:0,pitch:.35,vy:0,onGround:false};
function syncCamera(){
 camera.position.set(player.x,player.y,player.z);
 camera.rotation.order="YXZ";
 camera.rotation.y=player.yaw;
 camera.rotation.x=player.pitch;
}
syncCamera();

const raycaster=new THREE.Raycaster();
function targetBlock(){
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=raycaster.intersectObjects(Object.values(blocks),false);
 return hits.length&&hits[0].distance<6?hits[0]:null;
}

function breakBlock(){
 const hit=targetBlock();
 if(!hit){say("Mira hacia un bloque");return}
 const p=hit.object.userData;
 if(p.y<=-4)return;
 inventory[p.type]=(inventory[p.type]||0)+1;
 removeBlock(p.x,p.y,p.z);
 updateInventory();
}
function placeBlock(){
 const type=hotTypes[selected];
 if(inventory[type]<=0){say("No tienes ese bloque");return}
 const hit=targetBlock();
 if(!hit){say("Mira hacia un bloque");return}
 const pos=hit.object.position.clone().add(hit.face.normal);
 const x=Math.round(pos.x),y=Math.round(pos.y),z=Math.round(pos.z);
 if(Math.abs(x-player.x)<1&&Math.abs(z-player.z)<1&&Math.abs(y-player.y)<2){
  say("No puedes colocarlo dentro de ti");return;
 }
 if(blocks[key(x,y,z)])return;
 addBlock(x,y,z,type);
 inventory[type]--;
 if(type==="table")placedTable=true;
 updateInventory();
}

function jump(){
 if(player.onGround){
  player.vy=7;
  player.onGround=false;
 }
}

const keys={};
let started=false;
function startGame(){
 started=true;
 document.getElementById("start").style.display="none";
 if(!isMobile())renderer.domElement.requestPointerLock?.();
}
function isMobile(){
 return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||innerWidth<700;
}
if(isMobile()){
 document.getElementById("mobile").style.display="block";
 document.getElementById("mobileActions").style.display="flex";
}

document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="KeyE")toggleInventory();
 if(e.code==="Space"){e.preventDefault();jump()}
 if(e.code.startsWith("Digit")){
  const n=Number(e.code.slice(5))-1;
  if(n>=0&&n<8){selected=n;updateHotbar()}
 }
});
document.addEventListener("keyup",e=>keys[e.code]=false);

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 player.yaw-=e.movementX*.002;
 player.pitch-=e.movementY*.002;
 player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch));
});

renderer.domElement.addEventListener("click",()=>{
 if(started&&!isMobile()&&document.pointerLockElement!==renderer.domElement){
  renderer.domElement.requestPointerLock?.();
 }
});
renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());
renderer.domElement.addEventListener("mousedown",e=>{
 if(!started||document.getElementById("inventory").style.display==="block")return;
 if(e.button===0)breakBlock();
 if(e.button===2)placeBlock();
});

const mobileMove={};
document.querySelectorAll("[data-move]").forEach(btn=>{
 const name=btn.dataset.move;
 btn.addEventListener("touchstart",e=>{
  e.preventDefault();mobileMove[name]=true;
 });
 btn.addEventListener("touchend",e=>{
  e.preventDefault();mobileMove[name]=false;
 });
 btn.addEventListener("mousedown",()=>mobileMove[name]=true);
 btn.addEventListener("mouseup",()=>mobileMove[name]=false);
 btn.addEventListener("mouseleave",()=>mobileMove[name]=false);
});

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);
 last=now;

 if(started&&document.getElementById("inventory").style.display!=="block"){
  const forward=(keys.KeyW||keys.ArrowUp||mobileMove.forward)?1:0;
  const back=(keys.KeyS||keys.ArrowDown||mobileMove.back)?1:0;
  const left=(keys.KeyA||keys.ArrowLeft||mobileMove.left)?1:0;
  const right=(keys.KeyD||keys.ArrowRight||mobileMove.right)?1:0;
  const speed=5;
  const dx=(right-left)*speed*dt;
  const dz=(back-forward)*speed*dt;

  player.x+=dx*Math.cos(player.yaw)+dz*Math.sin(player.yaw);
  player.z+=-dx*Math.sin(player.yaw)+dz*Math.cos(player.yaw);

  // La gravedad solo modifica la posición del jugador
  player.vy-=18*dt;
  player.y+=player.vy*dt;
  const ground=heightAt(Math.round(player.x),Math.round(player.z))+1.7;
  if(player.y<ground){
   player.y=ground;
   player.vy=0;
   player.onGround=true;
  }
 }
 syncCamera();
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
addEventListener("resize",resize);
updateInventory();
</script>
</body>
</html>
