
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloquecraft Survival</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:25px;pointer-events:none;text-shadow:1px 1px 3px black}
#hotbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.slot{width:53px;height:53px;background:#333d;border:3px solid #777;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;font-size:23px;cursor:pointer}
.slot.selected{border:3px solid white;background:#666d}
.count{font-size:12px}
#info{position:fixed;top:10px;left:10px;background:#0009;color:white;padding:10px;line-height:1.5;font-size:13px;border-radius:5px}
#inventoryButton{position:fixed;top:12px;right:12px;padding:12px;background:#555;color:white;border:2px solid white;cursor:pointer}
#panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,94vw);max-height:85vh;overflow:auto;background:#777;border:5px solid #333;padding:15px;color:white;z-index:5}
#panel h2{text-align:center;margin-top:0}
.recipe{background:#444;border:2px solid #aaa;padding:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.recipe button{padding:9px;background:#9b9b9b;border:2px solid white;cursor:pointer;font-weight:bold}
.recipe button:disabled{opacity:.4;cursor:not-allowed}
#close{width:100%;padding:10px;margin-top:10px}
#message{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:#222d;color:white;padding:12px;border-radius:6px;display:none;z-index:10}
#mobile{display:none;position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;bottom:75px;left:20px;width:110px;height:110px;border-radius:50%;background:#ffffff55;border:2px solid white;pointer-events:auto;touch-action:none}
#nub{width:40px;height:40px;background:#fff9;border-radius:50%;position:absolute;left:33px;top:33px}
.action{position:absolute;right:15px;width:65px;height:55px;background:#333b;color:white;border:2px solid white;border-radius:8px;pointer-events:auto}
#mine{bottom:90px}
#place{bottom:25px}
#jump{right:95px;bottom:25px}
@media(pointer:coarse){#mobile{display:block}#info{display:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="cross">+</div>

<div id="info">
<b>BLOQUECRAFT SURVIVAL</b><br>
WASD: caminar<br>
Ratón: mirar<br>
Clic izquierdo: romper<br>
Clic derecho: colocar<br>
Espacio: saltar<br>
1-8: inventario
</div>

<button id="inventoryButton">INVENTARIO / CRAFTEO</button>
<div id="hotbar"></div>
<div id="message"></div>

<div id="panel">
<h2 id="panelTitle">INVENTARIO</h2>
<div id="inventoryContent"></div>
<button id="close">CERRAR</button>
</div>

<div id="mobile">
<div id="stick"><div id="nub"></div></div>
<button class="action" id="mine">ROMPER</button>
<button class="action" id="place">PONER</button>
<button class="action" id="jump">SALTAR</button>
</div>

<script>

// ======================================
// MOTOR 3D
// ======================================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,25,90);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,500
);

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

// ======================================
// LUCES
// ======================================

scene.add(new THREE.HemisphereLight(0xffffff,0x657747,1.5));

const sun=new THREE.DirectionalLight(0xffffff,1.8);
sun.position.set(-20,40,20);
sun.castShadow=true;
scene.add(sun);

// ======================================
// TEXTURAS PIXELADAS
// ======================================

function makeTexture(base,colors,seed){
 const canvas=document.createElement("canvas");
 canvas.width=canvas.height=64;
 const ctx=canvas.getContext("2d");

 ctx.fillStyle=base;
 ctx.fillRect(0,0,64,64);

 let n=seed;
 function random(){
  n=(n*16807)%2147483647;
  return (n-1)/2147483646;
 }

 for(let i=0;i<450;i++){
  ctx.fillStyle=colors[Math.floor(random()*colors.length)];
  const size=2+Math.floor(random()*5);
  ctx.fillRect(
   Math.floor(random()*64),
   Math.floor(random()*64),
   size,size
  );
 }

 const texture=new THREE.CanvasTexture(canvas);
 texture.magFilter=THREE.NearestFilter;
 texture.minFilter=THREE.NearestFilter;
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}

const dirtTexture=makeTexture("#79502b",
 ["#684020","#99663b","#85552e","#714625"],12);

const grassTexture=makeTexture("#55a52e",
 ["#438c24","#6cb63a","#367d20","#82c64b"],23);

const stoneTexture=makeTexture("#858585",
 ["#686868","#999999","#777777","#aaaaaa"],34);

const leavesTexture=makeTexture("#24772c",
 ["#17621e","#3d9638","#15551c","#4da83b"],45);

const woodTexture=makeTexture("#80502b",
 ["#613719","#a06a39","#70421e"],56);

function textured(texture){
 return new THREE.MeshLambertMaterial({map:texture});
}

const materials={
 grass:textured(grassTexture),
 dirt:textured(dirtTexture),
 stone:textured(stoneTexture),
 leaves:textured(leavesTexture),
 wood:textured(woodTexture),
 table:new THREE.MeshLambertMaterial({color:0x98602e}),
 furnace:new THREE.MeshLambertMaterial({color:0x555555})
};

// ======================================
// OBJETOS E INVENTARIO VACÍO
// ======================================

const definitions={
 grass:{name:"Césped",icon:"🟩",material:"grass",block:true},
 dirt:{name:"Tierra",icon:"🟫",material:"dirt",block:true},
 leaves:{name:"Hojas",icon:"🌿",material:"leaves",block:true},
 stone:{name:"Piedra",icon:"⬜",material:"stone",block:true},
 table:{name:"Mesa de crafteo",icon:"🛠️",material:"table",block:true},
 furnace:{name:"Horno",icon:"🔥",material:"furnace",block:true}
};

const inventory={};
Object.keys(definitions).forEach(k=>inventory[k]=0);

const blockGeometry=new THREE.BoxGeometry(1,1,1);
const blocks=new Map();
let selected="";

// ======================================
// CREAR Y QUITAR BLOQUES
// ======================================

function key(x,y,z){
 return `${x},${y},${z}`;
}

function createBlock(x,y,z,type){

 if(!definitions[type])return;
 if(blocks.has(key(x,y,z)))return;

 const mesh=new THREE.Mesh(
  blockGeometry,
  materials[definitions[type].material]
 );

 mesh.position.set(x,y,z);
 mesh.userData={x,y,z,type};
 mesh.castShadow=true;
 mesh.receiveShadow=true;

 scene.add(mesh);
 blocks.set(key(x,y,z),mesh);

 return mesh;
}

function removeBlock(mesh){

 if(!mesh)return;

 const d=mesh.userData;

 scene.remove(mesh);
 blocks.delete(key(d.x,d.y,d.z));

 inventory[d.type]++;
 updateInventory();
}

// ======================================
// GENERAR MUNDO
// ======================================

function terrainHeight(x,z){
 return Math.floor(
  Math.sin(x*.18)*2+
  Math.cos(z*.2)*2
 );
}

function generateWorld(){

 for(let x=-18;x<=18;x++){
  for(let z=-18;z<=18;z++){

   const h=terrainHeight(x,z);

   for(let y=-4;y<=h;y++){

    let type="stone";

    if(y===h)type="grass";
    else if(y>h-3)type="dirt";

    createBlock(x,y,z,type);
   }
  }
 }
}

// ======================================
// ÁRBOLES: SOLO HOJAS
// ======================================

function generateTree(x,z){

 const y=terrainHeight(x,z)+1;

 for(let dx=-2;dx<=2;dx++){
  for(let dz=-2;dz<=2;dz++){
   for(let dy=0;dy<=4;dy++){

    if(Math.abs(dx)+Math.abs(dz)+dy*.5<4.5){
     createBlock(x+dx,y+dy,z+dz,"leaves");
    }

   }
  }
 }
}

function generateTrees(){

 for(let i=0;i<25;i++){

  const x=Math.floor(Math.random()*29)-14;
  const z=Math.floor(Math.random()*29)-14;

  if(Math.abs(x)<3&&Math.abs(z)<3)continue;

  generateTree(x,z);
 }
}

// ======================================
// INVENTARIO Y BARRA
// ======================================

const hotbar=document.getElementById("hotbar");

function updateInventory(){

 hotbar.innerHTML="";

 const available=Object.keys(definitions).filter(
  k=>inventory[k]>0
 );

 // Ocho espacios, vacíos al principio
 for(let i=0;i<8;i++){

  const type=available[i];
  const slot=document.createElement("div");

  slot.className="slot";

  if(type){
   slot.innerHTML=
    definitions[type].icon+
    '<span class="count">'+inventory[type]+'</span>';

   slot.onclick=()=>selectItem(type);
  }

  if(type===selected)slot.classList.add("selected");

  hotbar.appendChild(slot);
 }
}

function selectItem(type){

 if(inventory[type]<=0)return;

 selected=type;
 updateInventory();
}

// ======================================
// SISTEMA DE CRAFTEO
// ======================================

let placedTable=false;
let placedFurnace=false;

function canCraft(recipe){

 return Object.entries(recipe.cost).every(
  ([type,amount])=>inventory[type]>=amount
 );
}

function craft(recipe){

 if(!canCraft(recipe)){
  showMessage("No tienes suficientes materiales");
  return;
 }

 if(recipe.requiresTable && !placedTable){
  showMessage("Primero coloca una mesa de crafteo");
  return;
 }

 for(const [type,amount] of Object.entries(recipe.cost)){
  inventory[type]-=amount;
 }

 inventory[recipe.result]++;

 updateInventory();
 openInventory();
 showMessage("¡Fabricaste "+definitions[recipe.result].name+"!");
}

const recipes=[
 {
  name:"Mesa de crafteo",
  result:"table",
  cost:{leaves:4},
  description:"4 hojas"
 },
 {
  name:"Horno",
  result:"furnace",
  cost:{stone:8},
  requiresTable:true,
  description:"8 piedras"
 }
];

function openInventory(){

 const panel=document.getElementById("panel");
 const content=document.getElementById("inventoryContent");

 panel.style.display="block";

 let html="<h3>Materiales</h3>";

 for(const [type,data] of Object.entries(definitions)){
  html+=`<p>${data.icon} ${data.name}: ${inventory[type]}</p>`;
 }

 html+="<h3>Recetas</h3>";

 recipes.forEach((r,i)=>{

  const allowed=canCraft(r)&&(!r.requiresTable||placedTable);

  html+=`
  <div class="recipe">
   <div>
    <b>${definitions[r.result].icon} ${r.name}</b>
    <br><small>Necesitas: ${r.description}</small>
   </div>
   <button data-recipe="${i}" ${allowed?"":"disabled"}>
    CREAR
   </button>
  </div>`;
 });

 content.innerHTML=html;

 content.querySelectorAll("[data-recipe]").forEach(btn=>{
  btn.onclick=()=>craft(recipes[Number(btn.dataset.recipe)]);
 });

}

document.getElementById("inventoryButton").onclick=openInventory;

document.getElementById("close").onclick=()=>{
 document.getElementById("panel").style.display="none";
};

// ======================================
// MENSAJES
// ======================================

let messageTimer;

function showMessage(text){

 const box=document.getElementById("message");
 box.textContent=text;
 box.style.display="block";

 clearTimeout(messageTimer);

 messageTimer=setTimeout(()=>{
  box.style.display="none";
 },1800);
}

// ======================================
// JUGADOR
// ======================================

const player={
 x:0,
 y:terrainHeight(0,5)+1.7,
 z:5,
 yaw:0,
 pitch:0,
 velocityY:0,
 grounded:false
};

camera.position.set(player.x,player.y,player.z);

const keys={};

document.addEventListener("keydown",e=>{

 keys[e.code]=true;

 if(e.code.startsWith("Digit")){
  const available=Object.keys(definitions).filter(k=>inventory[k]>0);
  const item=available[Number(e.code.slice(5))-1];
  if(item)selectItem(item);
 }

 if(e.code==="KeyE"){
  openInventory();
 }

});

document.addEventListener("keyup",e=>{
 keys[e.code]=false;
});

// ======================================
// CÁMARA
// ======================================

let locked=false;

renderer.domElement.addEventListener("click",()=>{

 if(matchMedia("(pointer:fine)").matches){
  renderer.domElement.requestPointerLock();
 }

});

document.addEventListener("pointerlockchange",()=>{
 locked=document.pointerLockElement===renderer.domElement;
});

document.addEventListener("mousemove",e=>{

 if(!locked)return;

 player.yaw-=e.movementX*.002;
 player.pitch-=e.movementY*.002;

 player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch));
});

// ======================================
// ROMPER BLOQUES
// ======================================

const raycaster=new THREE.Raycaster();
raycaster.far=6;

function targetBlock(){

 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);

 return raycaster.intersectObjects(
  Array.from(blocks.values())
 )[0];
}

function mineBlock(){

 const hit=targetBlock();

 if(hit){
  removeBlock(hit.object);
  showMessage("Bloque recogido");
 }else{
  showMessage("No estás apuntando a ningún bloque");
 }
}

// ======================================
// COLOCAR BLOQUES
// ======================================

function placeBlock(){

 if(!selected||inventory[selected]<=0){
  showMessage("No tienes bloques seleccionados");
  return;
 }

 const hit=targetBlock();

 if(!hit)return;

 const p=hit.object.position.clone();
 p.add(hit.face.normal);

 if(p.distanceTo(camera.position)<1.5)return;

 const x=Math.round(p.x);
 const y=Math.round(p.y);
 const z=Math.round(p.z);

 if(blocks.has(key(x,y,z)))return;

 createBlock(x,y,z,selected);
 inventory[selected]--;

 if(selected==="table")placedTable=true;
 if(selected==="furnace")placedFurnace=true;

 updateInventory();
}

// ======================================
// CONTROLES
// ======================================

document.addEventListener("mousedown",e=>{

 if(!locked)return;

 if(e.button===0)mineBlock();
 if(e.button===2)placeBlock();

});

document.addEventListener("contextmenu",e=>e.preventDefault());

// ======================================
// SALTO
// ======================================

function jump(){

 if(player.grounded){
  player.velocityY=7;
  player.grounded=false;
 }

}

// ======================================
// MOVIMIENTO Y GRAVEDAD
// ======================================

function update(dt){

 const forward=new THREE.Vector3(
  -Math.sin(player.yaw),0,-Math.cos(player.yaw)
 );

 const right=new THREE.Vector3(
  Math.cos(player.yaw),0,-Math.sin(player.yaw)
 );

 const move=new THREE.Vector3();

 if(keys.KeyW||keys.ArrowUp)move.add(forward);
 if(keys.KeyS||keys.ArrowDown)move.sub(forward);
 if(keys.KeyD||keys.ArrowRight)move.add(right);
 if(keys.KeyA||keys.ArrowLeft)move.sub(right);

 if(move.length()>0)move.normalize();

 const speed=5;

 player.x+=move.x*speed*dt;
 player.z+=move.z*speed*dt;

 player.x=Math.max(-17,Math.min(17,player.x));
 player.z=Math.max(-17,Math.min(17,player.z));

 player.velocityY-=18*dt;
 player.y+=player.velocityY*dt;

 const ground=terrainHeight(
  Math.round(player.x),
  Math.round(player.z)
 )+1.7;

 if(player.y<=ground){
  player.y=ground;
  player.velocityY=0;
  player.grounded=true;
 }else{
  player.grounded=false;
 }

 camera.position.set(player.x,player.y,player.z);
 camera.rotation.order="YXZ";
 camera.rotation.y=player.yaw;
 camera.rotation.x=player.pitch;
}

// ======================================
// DÍA Y NOCHE
// ======================================

let time=0;

function updateDayNight(dt){

 time+=dt*.015;

 const brightness=.35+.65*(Math.sin(time)+1)/2;

 sun.intensity=brightness*2;

}

// ======================================
// GUARDAR Y CARGAR MUNDO
// ======================================

function saveWorld(){

 const data=[];

 for(const b of blocks.values()){
  const d=b.userData;
  data.push([d.x,d.y,d.z,d.type]);
 }

 const save={
  blocks:data,
  inventory:inventory,
  player:{
   x:player.x,y:player.y,z:player.z
  },
  placedTable:placedTable,
  placedFurnace:placedFurnace
 };

 try{
  localStorage.setItem("bloquecraft_save",JSON.stringify(save));
 }catch(e){
  console.warn("Error al guardar",e);
 }

}

function loadWorld(){

 const raw=localStorage.getItem("bloquecraft_save");

 if(!raw)return;

 try{

  const save=JSON.parse(raw);

  for(const b of [...blocks.values()]){
   scene.remove(b);
  }

  blocks.clear();

  save.blocks.forEach(b=>{
   createBlock(b[0],b[1],b[2],b[3]);
  });

  Object.assign(inventory,save.inventory);

  player.x=save.player.x;
  player.y=save.player.y;
  player.z=save.player.z;

  placedTable=!!save.placedTable;
  placedFurnace=!!save.placedFurnace;

  updateInventory();

 }catch(e){
  console.warn("No se pudo cargar el mundo",e);
 }

}

// ======================================
// CONTROLES MÓVILES
// ======================================

let joystick={x:0,y:0};

const stick=document.getElementById("stick");
const nub=document.getElementById("nub");

let stickId=null;

stick.addEventListener("pointerdown",e=>{
 stickId=e.pointerId;
 stick.setPointerCapture(e.pointerId);
 moveStick(e);
});

stick.addEventListener("pointermove",e=>{
 if(e.pointerId===stickId)moveStick(e);
});

function moveStick(e){

 const r=stick.getBoundingClientRect();

 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;

 const len=Math.hypot(dx,dy);

 if(len>38){
  dx=dx/len*38;
  dy=dy/len*38;
 }

 joystick.x=dx/38;
 joystick.y=dy/38;

 nub.style.transform=`translate(${dx}px,${dy}px)`;
}

function resetStick(){
 joystick={x:0,y:0};
 stickId=null;
 nub.style.transform="";
}

stick.addEventListener("pointerup",resetStick);
stick.addEventListener("pointercancel",resetStick);

document.getElementById("mine").onclick=mineBlock;
document.getElementById("place").onclick=placeBlock;
document.getElementById("jump").onclick=jump;

let lookId=null;
let lastX=0,lastY=0;

renderer.domElement.addEventListener("pointerdown",e=>{

 if(e.pointerType==="touch"&&e.clientX>innerWidth*.4){
  lookId=e.pointerId;
  lastX=e.clientX;
  lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
 }

});

renderer.domElement.addEventListener("pointermove",e=>{

 if(e.pointerId!==lookId)return;

 player.yaw-=(e.clientX-lastX)*.006;
 player.pitch-=(e.clientY-lastY)*.006;

 player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch));

 lastX=e.clientX;
 lastY=e.clientY;

});

renderer.domElement.addEventListener("pointerup",e=>{
 if(e.pointerId===lookId)lookId=null;
});

// ======================================
// INICIAR JUEGO
// ======================================

generateWorld();
generateTrees();
updateInventory();
loadWorld();

let previous=performance.now();

function animate(now){

 requestAnimationFrame(animate);

 const dt=Math.min((now-previous)/1000,.04);
 previous=now;

 // Movimiento móvil
 if(joystick.x!==0||joystick.y!==0){

  const forward=new THREE.Vector3(
   -Math.sin(player.yaw),0,-Math.cos(player.yaw)
  );

  const right=new THREE.Vector3(
   Math.cos(player.yaw),0,-Math.sin(player.yaw)
  );

  const movement=forward.multiplyScalar(-joystick.y)
   .add(right.multiplyScalar(joystick.x));

  if(movement.length()>1)movement.normalize();

  player.x+=movement.x*5*dt;
  player.z+=movement.z*5*dt;
 }

 update(dt);
 updateDayNight(dt);

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

setInterval(saveWorld,5000);

window.addEventListener("beforeunload",saveWorld);

window.addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

</script>
</body>
</html>
