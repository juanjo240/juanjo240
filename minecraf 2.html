
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloqueCraft</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}
canvas{display:block}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:25px;text-shadow:1px 1px 3px black;pointer-events:none}
#top{position:fixed;top:10px;left:10px;color:white;text-shadow:2px 2px 3px black;font-weight:bold;pointer-events:none}
#hotbar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.slot{width:55px;height:55px;border:2px solid #777;background:#222a;display:flex;align-items:center;justify-content:center;color:white;position:relative;font-size:23px}
.slot.selected{border:3px solid white;background:#555c}
.count{position:absolute;right:3px;bottom:2px;font-size:13px}
#inventory{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#333f;border:3px solid #aaa;padding:18px;color:white;width:min(420px,94vw);max-height:85vh;overflow:auto}
#inventory h2{margin:0 0 12px}
#items{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.item{background:#555;padding:12px 3px;text-align:center;border:1px solid #999;cursor:pointer}
.item:hover{background:#777}
.recipe{display:block;width:100%;padding:10px;margin-top:8px;background:#777;color:white;border:1px solid #aaa;cursor:pointer}
#closeInv{margin-top:12px;padding:9px;width:100%}
#mobile{display:none;position:fixed;bottom:90px;left:12px;gap:5px}
#mobile button,#mobileActions button{width:48px;height:48px;background:#2229;color:white;border:1px solid #ddd;border-radius:8px;font-size:20px}
#mobile .row{display:flex;justify-content:center;gap:5px}
#mobileActions{display:none;position:fixed;right:12px;bottom:95px;gap:7px;flex-direction:column}
#message{position:fixed;top:45px;left:50%;transform:translateX(-50%);color:white;text-shadow:2px 2px 3px black;font-weight:bold}
#start{position:fixed;inset:0;background:#000b;color:white;display:flex;align-items:center;justify-content:center;text-align:center;z-index:10}
#start button{font-size:18px;padding:14px 24px;cursor:pointer}
</style>
</head>
<body>

<div id="top">BLOQUECRAFT<br><small>WASD: mover | Espacio: saltar | E: inventario</small></div>
<div id="crosshair">+</div>
<div id="message"></div>
<div id="hotbar"></div>

<div id="inventory">
<h2>Inventario y crafteo</h2>
<div id="items"></div>
<h3>Fabricación</h3>
<button class="recipe" onclick="craft('table')">Fabricar mesa de crafteo — 4 hojas</button>
<button class="recipe" onclick="craft('furnace')">Fabricar horno — 8 piedras (necesitas una mesa colocada)</button>
<p id="craftInfo"></p>
<button id="closeInv" onclick="toggleInventory()">Cerrar (E)</button>
</div>

<div id="mobile">
<div class="row"><button data-move="forward">▲</button></div>
<div class="row">
<button data-move="left">◀</button>
<button data-move="back">▼</button>
<button data-move="right">▶</button>
</div>
</div>
<div id="mobileActions">
<button onclick="jump()">↑</button>
<button onclick="breakBlock()">⛏</button>
<button onclick="placeBlock()">▣</button>
<button onclick="toggleInventory()">I</button>
</div>

<div id="start">
<div>
<h1> BLOQUECRAFT </h1>
<p>Un mundo de bloques te espera.</p>
<p>Haz clic para comenzar en PC.<br>En celular usa los controles de pantalla.</p>
<button onclick="startGame()">JUGAR</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){
 document.body.innerHTML='<h2 style="color:white;padding:30px">No se pudo cargar Three.js. Revisa tu conexión a internet y vuelve a abrir el juego.</h2>';
 throw new Error("Three.js no disponible");
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,25,65);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x64734c,1.5));
const sun=new THREE.DirectionalLight(0xffffff,1.1);
sun.position.set(20,35,15);
scene.add(sun);

const materials={};
function texture(color,spots){
 const c=document.createElement("canvas");
 c.width=c.height=16;
 const ctx=c.getContext("2d");
 ctx.fillStyle=color;ctx.fillRect(0,0,16,16);
 for(let i=0;i<spots;i++){
  ctx.fillStyle=Math.random()>.5?"#ffffff22":"#00000022";
  ctx.fillRect(Math.floor(Math.random()*16),Math.floor(Math.random()*16),2,2);
 }
 const t=new THREE.CanvasTexture(c);
 t.magFilter=THREE.NearestFilter;
 t.minFilter=THREE.NearestFilter;
 return new THREE.MeshLambertMaterial({map:t});
}
materials.grass=texture("#55a832",35);
materials.dirt=texture("#86502c",35);
materials.stone=texture("#858585",40);
materials.leaves=texture("#267b25",45);
materials.table=texture("#9b5c2c",25);
materials.furnace=texture("#555555",35);

const blocks={};
const key=(x,y,z)=>`${x},${y},${z}`;
const blockGeometry=new THREE.BoxGeometry(1,1,1);

function addBlock(x,y,z,type){
 const k=key(x,y,z);
 if(blocks[k])return;
 const mesh=new THREE.Mesh(blockGeometry,materials[type]||materials.dirt);
 mesh.position.set(x,y,z);
 mesh.userData={x,y,z,type};
 scene.add(mesh);
 blocks[k]=mesh;
}
function removeBlock(x,y,z){
 const k=key(x,y,z);
 const mesh=blocks[k];
 if(!mesh)return false;
 scene.remove(mesh);
 delete blocks[k];
 return true;
}
function heightAt(x,z){
 return Math.floor(
  2+
  Math.sin(x*.32)*1.2+
  Math.cos(z*.28)*1.1+
  Math.sin((x+z)*.18)*.8
 );
}

function generateWorld(){
 for(let x=-14;x<=14;x++){
  for(let z=-14;z<=14;z++){
   const h=heightAt(x,z);
   addBlock(x,h,z,"grass");
   for(let y=h-1;y>=h-2;y--)addBlock(x,y,z,"dirt");
   for(let y=h-3;y>=-3;y--)addBlock(x,y,z,"stone");
  }
 }
}

function tree(x,z){
 const h=heightAt(x,z);
 for(let y=1;y<=3;y++)addBlock(x,h+y,z,"dirt");
 for(let dx=-2;dx<=2;dx++){
  for(let dz=-2;dz<=2;dz++){
   for(let dy=2;dy<=4;dy++){
    if(Math.abs(dx)+Math.abs(dz)+(dy===4?1:0)<=4){
     addBlock(x+dx,h+dy,z+dz,"leaves");
    }
   }
  }
 }
}
generateWorld();
tree(-7,-5);
tree(7,-7);
tree(-5,8);
tree(9,5);
tree(1,-10);

const inventory={grass:0,dirt:0,stone:0,leaves:0,table:0,furnace:0};
const labels={grass:"Césped",dirt:"Tierra",stone:"Piedra",leaves:"Hojas",table:"Mesa",furnace:"Horno"};
const icons={grass:"🟩",dirt:"🟫",stone:"⬜",leaves:"🍃",table:"🪵",furnace:"🔥"};
let selected=0;
const hotTypes=["grass","dirt","stone","leaves","table","furnace"];

function updateInventory(){
 const items=document.getElementById("items");
 items.innerHTML="";
 for(const type of hotTypes){
  const div=document.createElement("div");
  div.className="item";
  div.innerHTML=`${icons[type]}<br>${labels[type]}<br>${inventory[type]}`;
  div.onclick=()=>{selected=hotTypes.indexOf(type);updateHotbar()};
  items.appendChild(div);
 }
 document.getElementById("craftInfo").textContent=
 "Mesa colocada: "+(placedTable?"Sí":"No");
 updateHotbar();
}
function updateHotbar(){
 const bar=document.getElementById("hotbar");
 bar.innerHTML="";
 hotTypes.forEach((type,i)=>{
  const slot=document.createElement("div");
  slot.className="slot"+(i===selected?" selected":"");
  slot.innerHTML=inventory[type]>0?icons[type]+`<span class="count">${inventory[type]}</span>`:"";
  bar.appendChild(slot);
 });
}
let placedTable=false;

function craft(type){
 if(type==="table"){
  if(inventory.leaves<4){say("Necesitas 4 hojas");return}
  inventory.leaves-=4;
  inventory.table++;
  say("¡Mesa fabricada!");
 }
 if(type==="furnace"){
  if(!placedTable){say("Primero coloca una mesa de crafteo");return}
  if(inventory.stone<8){say("Necesitas 8 piedras");return}
  inventory.stone-=8;
  inventory.furnace++;
  say("¡Horno fabricado!");
 }
 updateInventory();
}

function say(text){
 const el=document.getElementById("message");
 el.textContent=text;
 clearTimeout(say.timer);
 say.timer=setTimeout(()=>el.textContent="",1800);
}

const player={x:0,y:12,z:15,yaw:0,pitch:-.35,vy:0,onGround:false};
function syncCamera(){
 camera.position.set(player.x,player.y,player.z);
 camera.rotation.order="YXZ";
 camera.rotation.y=player.yaw;
 camera.rotation.x=player.pitch;
}
syncCamera();

const raycaster=new THREE.Raycaster();
function targetBlock(){
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=raycaster.intersectObjects(Object.values(blocks),false);
 return hits.length&&hits[0].distance<6?hits[0]:null;
}

function breakBlock(){
 const hit=targetBlock();
 if(!hit){say("No hay ningún bloque cerca");return}
 const p=hit.object.userData;
 if(p.y<=-3){say("No puedes romper este bloque");return}
 inventory[p.type]=(inventory[p.type]||0)+1;
 removeBlock(p.x,p.y,p.z);
 updateInventory();
}
function placeBlock(){
 const type=hotTypes[selected];
 if(inventory[type]<=0){say("No tienes ese bloque");return}
 const hit=targetBlock();
 if(!hit){say("Mira hacia un bloque para colocarlo");return}
 const normal=hit.face.normal.clone();
 const pos=hit.object.position.clone().add(normal);
 const x=Math.round(pos.x),y=Math.round(pos.y),z=Math.round(pos.z);
 if(Math.abs(x-player.x)<1&&Math.abs(z-player.z)<1&&Math.abs(y-player.y)<2){
  say("No puedes colocarlo dentro de ti");return;
 }
 if(blocks[key(x,y,z)])return;
 addBlock(x,y,z,type);
 inventory[type]--;
 if(type==="table")placedTable=true;
 updateInventory();
}
function toggleInventory(){
 const el=document.getElementById("inventory");
 el.style.display=el.style.display==="block"?"none":"block";
 updateInventory();
}
function jump(){
 if(player.onGround){player.vy=7;player.onGround=false}
}

const keys={};
let started=false;
function startGame(){
 started=true;
 document.getElementById("start").style.display="none";
 if(!isMobile())renderer.domElement.requestPointerLock?.();
}
function isMobile(){return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||innerWidth<700}
if(isMobile()){
 document.getElementById("mobile").style.display="block";
 document.getElementById("mobileActions").style.display="flex";
}

document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="KeyE")toggleInventory();
 if(e.code==="Space"){e.preventDefault();jump()}
 if(e.code.startsWith("Digit")){
  const n=Number(e.code.slice(5))-1;
  if(n>=0&&n<hotTypes.length){selected=n;updateHotbar()}
 }
});
document.addEventListener("keyup",e=>keys[e.code]=false);

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 player.yaw-=e.movementX*.002;
 player.pitch-=e.movementY*.002;
 player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch));
});

renderer.domElement.addEventListener("click",()=>{
 if(started&&!isMobile()&&document.pointerLockElement!==renderer.domElement){
  renderer.domElement.requestPointerLock?.();
 }
});
renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());
renderer.domElement.addEventListener("mousedown",e=>{
 if(!started||document.getElementById("inventory").style.display==="block")return;
 if(e.button===0)breakBlock();
 if(e.button===2)placeBlock();
});

let mobileMove={};
document.querySelectorAll("[data-move]").forEach(btn=>{
 const name=btn.dataset.move;
 btn.addEventListener("touchstart",e=>{e.preventDefault();mobileMove[name]=true});
 btn.addEventListener("touchend",e=>{e.preventDefault();mobileMove[name]=false});
 btn.addEventListener("mousedown",()=>mobileMove[name]=true);
 btn.addEventListener("mouseup",()=>mobileMove[name]=false);
 btn.addEventListener("mouseleave",()=>mobileMove[name]=false);
});

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);
 last=now;

 if(started&&document.getElementById("inventory").style.display!=="block"){
  const forward=(keys.KeyW||keys.ArrowUp||mobileMove.forward)?1:0;
  const back=(keys.KeyS||keys.ArrowDown||mobileMove.back)?1:0;
  const left=(keys.KeyA||keys.ArrowLeft||mobileMove.left)?1:0;
  const right=(keys.KeyD||keys.ArrowRight||mobileMove.right)?1:0;
  const speed=5;
  const dx=(right-left)*speed*dt;
  const dz=(back-forward)*speed*dt;
  player.x+=dx*Math.cos(player.yaw)+dz*Math.sin(player.yaw);
  player.z+=-dx*Math.sin(player.yaw)+dz*Math.cos(player.yaw);

  player.vy-=18*dt;
  player.y+=player.vy*dt;
  const ground=heightAt(Math.round(player.x),Math.round(player.z))+1.7;
  if(player.y<ground){player.y=ground;player.vy=0;player.onGround=true}
 }
 syncCamera();
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
addEventListener("resize",resize);

updateInventory();
</script>
</body>
</html>
